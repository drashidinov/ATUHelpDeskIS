<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ТП компклассов</title>
<style>
  :root {
    --ink: #1a2332;
    --ink-soft: #4a5568;
    --paper: #f7f8fa;
    --line: #dde1e7;
    --free: #1e8a5f;
    --free-bg: #e6f6ef;
    --busy: #c2410c;
    --busy-bg: #fdece1;
    --accent: #2952e3;
    --accent-dark: #1d3aa8;
    --urgent: #d62839;
    --urgent-bg: #fde9ea;
    --board-bg: #12161f;
    --board-panel: #1b202c;
    --board-line: #2a3142;
    --board-text: #e8ebf2;
    --board-dim: #7c8598;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .switcher {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .switcher button {
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .switcher button.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* ---------- TERMINAL ---------- */
  .terminal { flex: 1; padding: 28px 20px 60px; max-width: 640px; margin: 0 auto; width: 100%; }
  .room-picker { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .room-picker label { font-size: 13px; color: var(--ink-soft); }
  .room-picker select {
    font: inherit; font-size: 15px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; flex: 1;
  }

  .status-card {
    border-radius: 16px;
    padding: 26px 24px;
    margin-bottom: 22px;
    border: 1px solid var(--line);
  }
  .status-card.free { background: var(--free-bg); border-color: #b7e3cc; }
  .status-card.busy { background: var(--busy-bg); border-color: #f3c7ab; }

  .status-card .room-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .status-card .room-id { font-size: 30px; font-weight: 650; letter-spacing: -0.01em; margin-bottom: 14px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,.6);
  }
  .status-card.free .status-pill { color: var(--free); }
  .status-card.busy .status-pill { color: var(--busy); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .lesson-now { margin-top: 14px; font-size: 14px; line-height: 1.5; color: var(--ink); }
  .lesson-now .time { font-weight: 600; }

  .call-btn {
    width: 100%; padding: 18px; font: inherit; font-size: 17px; font-weight: 650;
    border: none; border-radius: 14px; cursor: pointer; color: #fff;
    background: var(--urgent);
    margin-bottom: 22px;
  }
  .call-btn:disabled { background: #b9bfc9; cursor: default; }
  .call-btn.sent { background: var(--ink-soft); }

  .call-feedback {
    text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: -12px; margin-bottom: 22px;
  }

  .day-schedule h3 { font-size: 14px; color: var(--ink-soft); font-weight: 600; margin: 0 0 10px; }
  .lesson-row {
    display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .lesson-row.current { background: #fff8e6; margin: 0 -12px; padding: 11px 12px; border-radius: 8px; border-bottom-color: transparent; }
  .lesson-row .t { width: 88px; flex-shrink: 0; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .lesson-row .info { color: var(--ink); line-height: 1.4; }
  .lesson-row .group { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .empty-day { color: var(--ink-soft); font-size: 13.5px; padding: 14px 0; }

  /* ---------- BOARD ---------- */
  .board {
    flex: 1; background: var(--board-bg); color: var(--board-text);
    padding: 22px 26px 40px;
  }
  .board-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .board-head h2 { margin: 0; font-size: 19px; font-weight: 650; }
  .board-head .clock { color: var(--board-dim); font-size: 13px; font-variant-numeric: tabular-nums; }

  .board-empty {
    border: 1px dashed var(--board-line); border-radius: 14px; padding: 40px 20px;
    text-align: center; color: var(--board-dim); font-size: 14px;
  }

  .call-grid { display: grid; gap: 10px; }
  .call-card {
    background: var(--board-panel); border: 1px solid var(--board-line); border-radius: 12px;
    padding: 15px 16px; display: flex; align-items: center; gap: 16px;
  }
  .call-card.new { border-color: var(--urgent); box-shadow: 0 0 0 1px var(--urgent); }
  .call-card .room-block { min-width: 96px; }
  .call-card .room-block .rn { font-size: 20px; font-weight: 650; }
  .call-card .room-block .rb { font-size: 11.5px; color: var(--board-dim); }
  .call-card .meta { flex: 1; font-size: 12.5px; color: var(--board-dim); }
  .call-card .meta .ago { color: var(--board-text); font-size: 13px; margin-bottom: 2px; }
  .call-card .actions { display: flex; gap: 8px; }
  .call-card button {
    font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 13px;
    border-radius: 8px; border: 1px solid var(--board-line); cursor: pointer;
    background: transparent; color: var(--board-text);
  }
  .call-card button.accept { background: var(--accent); border-color: var(--accent); }
  .call-card button.close { background: transparent; }
  .badge-status { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
  .badge-status.status-new { background: var(--urgent-bg); color: var(--urgent); }
  .badge-status.status-accepted { background: #e1e8fd; color: var(--accent-dark); }

  .board-section-label { font-size: 12px; color: var(--board-dim); margin: 24px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
  .closed-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--board-dim); padding: 7px 2px; border-bottom: 1px solid var(--board-line); }

  .reset-link { text-align: center; margin-top: 30px; }
  .reset-link button { background: none; border: none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; cursor: pointer; }
</style>

const DAY_ORDER = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const JS_DAY_TO_RU = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

function parseTimeRange(t) {
  // "8.30-9.20" -> [510, 560] minutes
  const [a,b] = t.split('-');
  const toMin = s => { const [h,m] = s.split('.').map(Number); return h*60+m; };
  return [toMin(a), toMin(b)];
}
function nowMinutes() {
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function todayRu() {
  return JS_DAY_TO_RU[new Date().getDay()];
}

/* ============ STORAGE / BACKEND LAYER ============ */
// Два режима работы:
// 1) Превью в Claude — есть window.storage (persistent artifact storage).
// 2) Реальный хостинг (на вашем сервере) — window.storage нет, работаем
//    через REST API (см. server/server.js), который отдаётся тем же сервером.
const hasWidgetStorage = (typeof window !== 'undefined') && !!window.storage
  && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';

async function getCalls() {
  if (hasWidgetStorage) {
    try {
      const res = await window.storage.get('calls-list', true);
      return res ? JSON.parse(res.value) : [];
    } catch (e) {
      return [];
    }
  }
  try {
    const res = await fetch('/api/calls');
    if (!res.ok) throw new Error('bad status ' + res.status);
    return await res.json();
  } catch (e) {
    console.error('getCalls error', e);
    return [];
  }
}

async function addCall(room, buildingName) {
  if (hasWidgetStorage) {
    try {
      const calls = await getCalls();
      calls.push({
        id: 'c' + Date.now() + Math.random().toString(36).slice(2,7),
        room, buildingName, createdAt: Date.now(), status: 'new',
      });
      await window.storage.set('calls-list', JSON.stringify(calls), true);
      return true;
    } catch (e) {
      console.error('addCall error', e);
      return false;
    }
  }
  try {
    const res = await fetch('/api/calls', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room, buildingName }),
    });
    if (!res.ok) throw new Error('bad status ' + res.status);
    return true;
  } catch (e) {
    console.error('addCall error', e);
    return false;
  }
}

async function setCallStatus(id, status) {
  if (hasWidgetStorage) {
    try {
      const calls = await getCalls();
      const idx = calls.findIndex(c => c.id === id);
      if (idx >= 0) calls[idx].status = status;
      await window.storage.set('calls-list', JSON.stringify(calls), true);
      return true;
    } catch (e) {
      console.error('setCallStatus error', e);
      return false;
    }
  }
  try {
    const res = await fetch('/api/calls/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    if (!res.ok) throw new Error('bad status ' + res.status);
    return true;
  } catch (e) {
    console.error('setCallStatus error', e);
    return false;
  }
}

async function clearCalls() {
  if (hasWidgetStorage) {
    try {
      await window.storage.set('calls-list', JSON.stringify([]), true);
      return true;
    } catch (e) {
      return false;
    }
  }
  try {
    const res = await fetch('/api/calls', { method: 'DELETE' });
    return res.ok;
  } catch (e) {
    return false;
  }
}

/* ============ STATE ============ */
let view = 'terminal';
let selectedRoom = ROOMS[0].id;
let callSentFor = null; // room id that just got a call sent, to disable button briefly
let callsCache = [];

const root = document.getElementById('root');

function render() {
  root.innerHTML = '';
  const app = document.createElement('div');
  app.className = 'app';

  const switcher = document.createElement('div');
  switcher.className = 'switcher';
  switcher.innerHTML = `
    <button data-v="terminal" class="${view==='terminal'?'active':''}">Терминал класса</button>
    <button data-v="board" class="${view==='board'?'active':''}">Табло техподдержки</button>
  `;
  switcher.querySelectorAll('button').forEach(b=>{
    b.onclick = () => { view = b.dataset.v; render(); };
  });
  app.appendChild(switcher);

  if (view === 'terminal') app.appendChild(renderTerminal());
  else app.appendChild(renderBoard());

  root.appendChild(app);
}

/* ============ TERMINAL VIEW ============ */
function renderTerminal() {
  const wrap = document.createElement('div');
  wrap.className = 'terminal';

  const room = ROOMS.find(r => r.id === selectedRoom);
  const day = todayRu();
  const now = nowMinutes();

  const todays = SCHEDULE.filter(s => s.room === room.id && s.day === day)
    .sort((a,b)=> parseTimeRange(a.time)[0] - parseTimeRange(b.time)[0]);

  const current = todays.find(s => {
    const [start,end] = parseTimeRange(s.time);
    return now >= start && now <= end;
  });

  // room picker
  const picker = document.createElement('div');
  picker.className = 'room-picker';
  const buildings = [...new Set(ROOMS.map(r=>r.building))];
  let optionsHtml = '';
  buildings.forEach(b => {
    optionsHtml += `<optgroup label="${ROOMS.find(r=>r.building===b).buildingName}">`;
    ROOMS.filter(r=>r.building===b).forEach(r=>{
      optionsHtml += `<option value="${r.id}" ${r.id===selectedRoom?'selected':''}>Ауд. ${r.id}</option>`;
    });
    optionsHtml += `</optgroup>`;
  });
  picker.innerHTML = `<label>Класс:</label><select id="room-select">${optionsHtml}</select>`;
  wrap.appendChild(picker);
  picker.querySelector('select').onchange = (e) => { selectedRoom = e.target.value; callSentFor = null; render(); };

  // status card
  const card = document.createElement('div');
  card.className = 'status-card ' + (current ? 'busy' : 'free');
  card.innerHTML = `
    <div class="room-label">${room.buildingName} · ${room.address}</div>
    <div class="room-id">Ауд. ${room.id}</div>
    <div class="status-pill"><span class="status-dot"></span>${current ? 'Идёт занятие' : 'Класс свободен'}</div>
    ${current ? `<div class="lesson-now"><span class="time">${current.time}</span> — ${current.info}</div>` : ''}
  `;
  wrap.appendChild(card);

  // call button
  const btn = document.createElement('button');
  const isSent = callSentFor === room.id;
  btn.className = 'call-btn' + (isSent ? ' sent' : '');
  btn.textContent = isSent ? 'Вызов отправлен ✓' : 'Вызвать специалиста';
  btn.disabled = isSent;
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = 'Отправка…';
    const ok = await addCall(room.id, room.buildingName);
    if (ok) {
      callSentFor = room.id;
    } else {
      btn.textContent = 'Не удалось отправить, повторите';
      btn.disabled = false;
      return;
    }
    render();
  };
  wrap.appendChild(btn);

  if (isSent) {
    const fb = document.createElement('div');
    fb.className = 'call-feedback';
    fb.textContent = 'Специалист уведомлён и скоро подойдёт.';
    wrap.appendChild(fb);
  }

  // today's schedule
  const sched = document.createElement('div');
  sched.className = 'day-schedule';
  sched.innerHTML = `<h3>Расписание на сегодня (${day})</h3>`;
  if (todays.length === 0) {
    sched.innerHTML += `<div class="empty-day">Занятий не найдено — класс свободен весь день.</div>`;
  } else {
    todays.forEach(s => {
      const [start,end] = parseTimeRange(s.time);
      const isCur = now >= start && now <= end;
      const row = document.createElement('div');
      row.className = 'lesson-row' + (isCur ? ' current' : '');
      row.innerHTML = `<div class="t">${s.time}</div><div><div class="info">${s.info}</div>${s.group?`<div class="group">${s.group}</div>`:''}</div>`;
      sched.appendChild(row);
    });
  }
  wrap.appendChild(sched);

  return wrap;
}

/* ============ BOARD VIEW ============ */
function timeAgo(ts) {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return `${s} с назад`;
  const m = Math.floor(s/60);
  if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m/60);
  return `${h} ч назад`;
}

function renderBoard() {
  const wrap = document.createElement('div');
  wrap.className = 'board';

  const head = document.createElement('div');
  head.className = 'board-head';
  head.innerHTML = `<h2>Активные вызовы</h2><span class="clock">${new Date().toLocaleTimeString('ru-RU')}</span>`;
  wrap.appendChild(head);

  const activeGrid = document.createElement('div');
  const active = callsCache.filter(c => c.status !== 'closed').sort((a,b)=> b.createdAt - a.createdAt);
  const closed = callsCache.filter(c => c.status === 'closed').sort((a,b)=> b.createdAt - a.createdAt).slice(0,8);

  if (active.length === 0) {
    activeGrid.innerHTML = `<div class="board-empty">Нет активных вызовов. Новые вызовы из классов появятся здесь автоматически.</div>`;
  } else {
    activeGrid.className = 'call-grid';
    active.forEach(c => {
      const isNew = c.status === 'new';
      const room = ROOMS.find(r=>r.id===c.room);
      const card = document.createElement('div');
      card.className = 'call-card' + (isNew ? ' new' : '');
      card.innerHTML = `
        <div class="room-block"><div class="rn">${c.room}</div><div class="rb">${room ? room.buildingName : ''}</div></div>
        <div class="meta">
          <div class="ago">${timeAgo(c.createdAt)}</div>
          <span class="badge-status status-${isNew?'new':'accepted'}">${isNew?'Новый':'Принят'}</span>
        </div>
        <div class="actions">
          ${isNew ? `<button class="accept" data-id="${c.id}" data-act="accept">Принять</button>` : ''}
          <button class="close" data-id="${c.id}" data-act="close">Закрыть</button>
        </div>
      `;
      activeGrid.appendChild(card);
    });
  }
  wrap.appendChild(activeGrid);

  if (closed.length) {
    const label = document.createElement('div');
    label.className = 'board-section-label';
    label.textContent = 'Недавно закрытые';
    wrap.appendChild(label);
    closed.forEach(c => {
      const row = document.createElement('div');
      row.className = 'closed-row';
      row.innerHTML = `<span>Ауд. ${c.room}</span><span>${timeAgo(c.createdAt)}</span>`;
      wrap.appendChild(row);
    });
  }

  wrap.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    btn.disabled = true;
    const ok = await setCallStatus(id, act === 'accept' ? 'accepted' : 'closed');
    if (ok) {
      callsCache = await getCalls();
      render();
    } else {
      btn.disabled = false;
    }
  });

  const resetWrap = document.createElement('div');
  resetWrap.className = 'reset-link';
  resetWrap.innerHTML = `<button id="reset-btn">Очистить все вызовы</button>`;
  wrap.appendChild(resetWrap);
  resetWrap.querySelector('button').onclick = async () => {
    await clearCalls();
    callsCache = [];
    render();
  };

  return wrap;
}

/* ============ POLLING ============ */
async function refreshCalls() {
  callsCache = await getCalls();
  if (view === 'board') render();
}
refreshCalls();
setInterval(refreshCalls, 3000);
setInterval(() => { if (view === 'board') render(); }, 1000); // clock/timer tick

render();
</script>
