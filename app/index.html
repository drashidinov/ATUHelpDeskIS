<title>Накладки — расписание компклассов АТУ</title>
<style>
  :root {
    --ink: #1a2332;
    --ink-soft: #4a5568;
    --paper: #f7f8fa;
    --line: #dde1e7;
    --busy: #c2410c;
    --urgent: #d62839;
    --urgent-bg: #fde9ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .app { min-height: 100vh; }

  .page-head {
    padding: 22px 20px 6px; max-width: 760px; margin: 0 auto;
  }
  .page-head h1 { font-size: 19px; margin: 0 0 4px; }
  .page-head p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  .conflicts { padding: 18px 20px 60px; max-width: 760px; margin: 0 auto; width: 100%; }
  .conflicts-summary { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .sum-chip {
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: #fff; border: 1px solid var(--line); color: var(--ink-soft);
  }
  .sum-chip.warn { background: var(--urgent-bg); color: var(--urgent); border-color: #f5c2c7; }
  .conflicts-empty {
    border: 1px dashed var(--line); border-radius: 14px; padding: 34px 20px;
    text-align: center; color: var(--ink-soft); font-size: 14px; background: #fff;
  }
  .conflict-group-title {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft);
    margin: 22px 0 10px;
  }
  .conflict-card {
    background: #fff; border: 1px solid #f3c7ab; border-left: 4px solid var(--busy);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  }
  .conflict-card .cc-head {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;
  }
  .conflict-card .cc-key { font-weight: 650; font-size: 14.5px; }
  .conflict-card .cc-day { font-size: 12px; color: var(--ink-soft); }
  .conflict-card .cc-day.today { color: var(--urgent); font-weight: 650; }
  .cc-session { display: flex; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .cc-session:first-of-type { border-top: none; }
  .cc-session .t { width: 82px; flex-shrink: 0; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .cc-session .info { line-height: 1.4; }
  .cc-session .group { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .cc-session .room-tag { color: var(--ink-soft); font-size: 12px; }
  .footnote { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 18px; }
</style>
</head>

const DAY_ORDER = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const JS_DAY_TO_RU = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

function parseTimeRange(t) {
  // "8.30-9.20" -> [510, 560] minutes
  const [a,b] = t.split('-');
  const toMin = s => { const [h,m] = s.split('.').map(Number); return h*60+m; };
  return [toMin(a), toMin(b)];
}
function nowMinutes() {
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function todayRu() {
  return JS_DAY_TO_RU[new Date().getDay()];
}



/* ============ НАКЛАДКИ (CONFLICTS) ============ */
// Эвристика: сравниваем тексты занятий (Dice-коэффициент по биграммам), чтобы
// отличить настоящую накладку (два разных занятия) от дублей одной и той же
// записи, встречающейся в нескольких файлах расписания (разные факультеты
// делят общие предметы вроде "Философия"). Не 100% точность — список для
// проверки человеком, а не окончательный вердикт.
function normTextC(s) {
  return s.toLowerCase().replace(/\s+/g,' ').trim().replace(/[.,;]+$/,'');
}
const TYPE_RE_C = /(лекция|лекц|лек\.?зан\.?|лек\.|практика|практ|лаб\.?зан\.?|лабораторная|лаб\.|семинар)/i;
function subjectPartC(s) {
  const m = s.match(TYPE_RE_C);
  let subj = m ? s.slice(0, m.index) : s;
  return subj.replace(/[/\-,]+$/,'').trim().toLowerCase();
}
function bigramsC(s) {
  const b = [];
  for (let i=0;i<s.length-1;i++) b.push(s.slice(i,i+2));
  return b;
}
function diceCoeffC(a, b) {
  if (a === b) return 1;
  if (!a.length || !b.length) return 0;
  const ba = bigramsC(a), bb = bigramsC(b);
  const mapB = {};
  bb.forEach(g => mapB[g] = (mapB[g]||0)+1);
  let matches = 0;
  ba.forEach(g => { if (mapB[g] > 0) { matches++; mapB[g]--; } });
  return (2*matches) / (ba.length + bb.length);
}
function isSameSessionC(a, b) {
  const na = normTextC(a), nb = normTextC(b);
  if (na === nb) return true;
  if (diceCoeffC(na, nb) >= 0.65) return true;
  const hasVacA = na.includes('вакан');
  const hasVacB = nb.includes('вакан');
  if (hasVacA !== hasVacB) {
    if (diceCoeffC(subjectPartC(a), subjectPartC(b)) >= 0.72) return true;
  }
  return false;
}

function findOverlapClusters(items, options) {
  const restrictSameRoom = !!(options && options.restrictSameRoom);
  // items: сессии одного дня для одного ключа (аудитория или преподаватель),
  // отсортированные по времени начала. Возвращает кластеры "одно и то же занятие".
  const sorted = items.slice().sort((a,b)=> parseTimeRange(a.time)[0]-parseTimeRange(b.time)[0]);
  const clusters = [];
  sorted.forEach(it => {
    let placed = false;
    for (const cl of clusters) {
      const rep = cl.rep;
      const [rs,re] = parseTimeRange(rep.time);
      const [is_,ie] = parseTimeRange(it.time);
      const overlap = is_ < re && rs < ie;
      // Для накладок по преподавателю два занятия в РАЗНЫХ кабинетах никогда не
      // считаем одним и тем же занятием, даже при похожем тексте — один человек
      // не может вести пару одновременно в двух аудиториях, это и есть накладка.
      const roomOk = !restrictSameRoom || rep.room === it.room;
      if (overlap && roomOk && isSameSessionC(rep.info, it.info)) {
        cl.members.push(it);
        placed = true;
        break;
      }
    }
    if (!placed) clusters.push({ rep: it, members: [it] });
  });
  return clusters;
}

function computeConflicts() {
  // room conflicts
  const byRoomDay = {};
  SCHEDULE.forEach(r => {
    const key = r.room + '|' + r.day;
    (byRoomDay[key] = byRoomDay[key] || []).push(r);
  });
  const roomConflicts = [];
  Object.entries(byRoomDay).forEach(([key, items]) => {
    const [room, day] = key.split('|');
    const clusters = findOverlapClusters(items);
    for (let i=0;i<clusters.length;i++) {
      for (let j=i+1;j<clusters.length;j++) {
        const a = clusters[i].rep, b = clusters[j].rep;
        const [as,ae] = parseTimeRange(a.time), [bs,be] = parseTimeRange(b.time);
        if (as < be && bs < ae) {
          roomConflicts.push({ key: room, day, sessions: [a, b] });
        }
      }
    }
  });

  // teacher conflicts (тот же преподаватель, разные аудитории, пересекающееся время)
  const byTeacherDay = {};
  SCHEDULE.forEach(r => {
    if (!r.teacher) return;
    const key = r.teacher + '|' + r.day;
    (byTeacherDay[key] = byTeacherDay[key] || []).push(r);
  });
  const teacherConflicts = [];
  Object.entries(byTeacherDay).forEach(([key, items]) => {
    const [teacher, day] = key.split('|');
    const clusters = findOverlapClusters(items, { restrictSameRoom: true });
    for (let i=0;i<clusters.length;i++) {
      for (let j=i+1;j<clusters.length;j++) {
        const a = clusters[i].rep, b = clusters[j].rep;
        if (a.room === b.room) continue; // тот же кабинет — не конфликт по препод.
        const [as,ae] = parseTimeRange(a.time), [bs,be] = parseTimeRange(b.time);
        if (as < be && bs < ae) {
          teacherConflicts.push({ key: teacher, day, sessions: [a, b] });
        }
      }
    }
  });

  return { roomConflicts, teacherConflicts };
}

function renderConflicts() {
  const wrap = document.createElement('div');
  wrap.className = 'conflicts';

  const { roomConflicts, teacherConflicts } = computeConflicts();
  const today = todayRu();

  const summary = document.createElement('div');
  summary.className = 'conflicts-summary';
  summary.innerHTML = `
    <div class="sum-chip ${roomConflicts.length?'warn':''}">По аудиториям: ${roomConflicts.length}</div>
    <div class="sum-chip ${teacherConflicts.length?'warn':''}">По преподавателям: ${teacherConflicts.length}</div>
  `;
  wrap.appendChild(summary);

  if (roomConflicts.length === 0 && teacherConflicts.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'conflicts-empty';
    empty.textContent = 'Накладок не найдено — по текущим данным аудитории и преподаватели не пересекаются.';
    wrap.appendChild(empty);
    return wrap;
  }

  function renderCard(c, keyLabel) {
    const card = document.createElement('div');
    card.className = 'conflict-card';
    const isToday = c.day === today;
    card.innerHTML = `
      <div class="cc-head">
        <div class="cc-key">${keyLabel}: ${c.key}</div>
        <div class="cc-day ${isToday?'today':''}">${c.day}${isToday?' · сегодня':''}</div>
      </div>
      ${c.sessions.map(s => `
        <div class="cc-session">
          <div class="t">${s.time}</div>
          <div>
            <div class="info">${s.info}</div>
            ${s.group ? `<div class="group">${s.group}</div>` : ''}
            ${keyLabel==='Преподаватель' ? `<div class="room-tag">Ауд. ${s.room}</div>` : ''}
          </div>
        </div>
      `).join('')}
    `;
    return card;
  }

  if (roomConflicts.length) {
    const label = document.createElement('div');
    label.className = 'conflict-group-title';
    label.textContent = 'Накладки по аудиториям';
    wrap.appendChild(label);
    roomConflicts
      .sort((a,b)=> (a.day===today?-1:1) - (b.day===today?-1:1))
      .forEach(c => wrap.appendChild(renderCard(c, 'Аудитория')));
  }

  if (teacherConflicts.length) {
    const label = document.createElement('div');
    label.className = 'conflict-group-title';
    label.textContent = 'Накладки по преподавателям';
    wrap.appendChild(label);
    teacherConflicts
      .sort((a,b)=> (a.day===today?-1:1) - (b.day===today?-1:1))
      .forEach(c => wrap.appendChild(renderCard(c, 'Преподаватель')));
  }

  const note = document.createElement('div');
  note.className = 'call-feedback';
  note.style.marginTop = '18px';
  note.textContent = 'Список формируется автоматически по совпадению текста занятий — возможны отдельные ложные срабатывания, сверяйтесь с исходным расписанием.';
  wrap.appendChild(note);

  return wrap;
}



/* ============ RENDER ============ */
function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const app = document.createElement('div');
  app.className = 'app';

  const head = document.createElement('div');
  head.className = 'page-head';
  head.innerHTML = `
    <h1>Накладки в расписании</h1>
    <p>Конфликты по аудиториям и по преподавателям — компклассы техподдержки АТУ</p>
  `;
  app.appendChild(head);

  app.appendChild(renderConflicts());
  root.appendChild(app);
}

render();
